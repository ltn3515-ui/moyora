<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>모여라 - 나의 모임</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="add.css">
</head>

<body>
  <div class="app">

    <main class="screen active" id="screen-add">

      <!-- 헤더 -->
      <header class="header">
        <button class="header__back" id="btnBack" aria-label="뒤로가기">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="#7A5C29" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="header__center">
          <a href="index.html" class="header__logo-link">
            <img class="header__logo" src="img_logo_full.png" alt="모여라">
          </a>
        </div>
        <button class="header__bell" aria-label="알림">
          🔔<span class="header__bell-badge"></span>
        </button>
      </header>

      <!-- 검색창 -->
      <div class="search-bar">
        <span class="search-bar__icon">🔍</span>
        <input type="text" placeholder="관심사를 찾아보세요..." />
      </div>

      <!-- 나의 모임 -->
      <h1 class="page-title">나의 모임</h1>
      <div class="group-grid" id="groupGrid"></div>

      <!-- 최근 활동 -->
      <section class="section" style="margin-top: 28px;">
        <div class="section__header">
          <h2 class="section__title">최근 활동</h2>
          <button class="section__link" aria-label="모두 보기">모두 보기</button>
        </div>
        <div class="activity-list" id="activityList"></div>
      </section>

      <!-- 모임 생성 입력 폼 (오버레이) -->
      <div class="form-overlay" id="formOverlay">
        <div class="form-sheet">
          <h2 class="form-sheet__title">새 모임 만들기</h2>
          <div class="form-field">
            <label for="inputGroupName">모임 이름</label>
            <input type="text" id="inputGroupName" placeholder="예: 주말 등산 모임" maxlength="20" />
          </div>

          <div class="form-field">
            <label>카드 색상</label>
            <div class="color-picker">
              <button type="button" class="color-picker__dot" data-color="yellow" aria-label="옐로우"></button>
              <button type="button" class="color-picker__dot" data-color="pink" aria-label="핑크"></button>
              <button type="button" class="color-picker__dot" data-color="blue" aria-label="블루"></button>
            </div>
          </div>

          <div class="form-actions">
            <button class="btn btn-secondary" id="btnCancelForm">취소</button>
            <button class="btn btn-primary" id="btnSubmitForm">모임 만들기</button>
          </div>
        </div>
      </div>

      <!-- 하단 네비게이션 -->
      <nav class="bottom-nav" id="bottomNav"></nav>

    </main>

  </div>

  <script src="data.js"></script>
  <script src="common.js"></script>
  <script src="add.js"></script>
</body>

</html>
