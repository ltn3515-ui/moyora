<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>모여라 - 검색</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="search.css">
</head>

<body>

  <div class="app">
    <div class="screen active search-screen">

      <!-- 배경(뒤에 깔리는 화면 - friends/index 위에 뜨는 오버레이 모달임을 표현) -->
      <div class="search-backdrop" id="searchBackdrop">
        <div class="search-backdrop__header">
          <div class="search-backdrop__logo">
            <img src="img_logo_full.png" alt="모여라" style="height: 52px; display: block;">
          </div>
          <div class="search-backdrop__avatar">
            <img src="avatar_leetaeno.png" alt="">
          </div>
        </div>
        <span class="search-backdrop__dim" aria-hidden="true"></span>
      </div>

      <!-- 검색 모달 시트 -->
      <div class="search-sheet" role="dialog" aria-modal="true" aria-label="검색">
        <span class="search-sheet__handle" aria-hidden="true"></span>

        <div class="search-sheet__head">
          <h1 class="search-sheet__title">검색</h1>
          <button type="button" class="search-sheet__close" id="searchCloseBtn" aria-label="검색 닫기">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
        </div>

        <label class="search-input-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="6.5" />
            <path d="m20 20-4.3-4.3" />
          </svg>
          <input type="text" id="searchInput" placeholder="검색어를 입력하세요" autocomplete="off">
        </label>

        <div class="search-block">
          <div class="search-block__head">
            <span class="search-block__title">최근 검색어</span>
            <button type="button" class="search-block__action" id="searchClearAllBtn">전체 삭제</button>
          </div>
          <div class="search-tags" id="searchTags"></div>
        </div>

        <div class="search-block">
          <div class="search-block__head">
            <span class="search-block__title">인기 카테고리</span>
          </div>
          <div class="category-grid" id="categoryGrid"></div>
        </div>

        <div class="search-banner">
          <span class="search-banner__icon" id="searchBannerIcon"></span>
          <div>
            <div class="search-banner__title">나만의 맞춤 활동 찾기</div>
            <p class="search-banner__desc">취향을 입력하고 새로운 영감을 만나보세요.</p>
          </div>
        </div>

      </div>

    </div>
  </div>

  <script src="data.js"></script>
  <script src="common.js"></script>
  <script src="search.js"></script>
</body>

</html>
