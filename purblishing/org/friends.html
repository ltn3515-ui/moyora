<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>모여라 | 친구</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="friends.css">
</head>

<body>
  <div class="app">
    <div class="screen active">

      <!-- 헤더 -->
      <header class="header">
        <button class="header__back" id="btnBack" aria-label="뒤로가기">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="#7A5C29" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="header__center">
          <span class="header__title">친구</span>
        </div>
        <button class="header__bell" aria-label="알림">
          🔔<span class="header__bell-badge"></span>
        </button>
      </header>

      <!-- 친구 검색 -->
      <div class="search-bar">
        <span class="search-bar__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="6.5" />
            <path d="m20 20-4.3-4.3" />
          </svg>
        </span>
        <input id="friendSearchInput" class="search-bar__input" type="text" placeholder="친구 검색" readonly>
      </div>

      <!-- 나의 프로필 카드 -->
      <div id="profileCard" class="profile-card"></div>

      <!-- 즐겨찾기 -->
      <section class="section">
        <div class="section__head">
          <h2 class="section__title">즐겨찾기</h2>
          <button class="section__link" type="button">더보기</button>
        </div>
        <ul id="favoritesList" class="favorites"></ul>
      </section>

      <!-- 친구 리스트 -->
      <section class="section">
        <div class="section__head">
          <h2 class="section__title">친구</h2>
        </div>
        <ul id="friendList" class="friend-list card"></ul>
      </section>

      <!-- 새로운 친구 탐색 배너 -->
      <div class="section">
        <div class="discover-banner">
          <span class="discover-banner__sparkle">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2l1.8 5.6L19 9l-5.2 1.9L12 16l-1.8-5.1L5 9l5.2-1.4L12 2Z" />
            </svg>
          </span>
          <p class="discover-banner__title">새로운 친구를 찾아보세요!</p>
          <p class="discover-banner__desc">주변의 흥미로운 모임에 참여하고 인연을 만들어보세요.</p>
          <button class="btn btn-primary" type="button">탐색하기</button>
        </div>
      </div>

    </div>

    <!-- 친구 추가 플로팅 버튼 -->
    <button class="btn-floating friends-fab" type="button" aria-label="친구 추가">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="8" r="3.2" />
        <path d="M2.5 20c0-3.3 2.9-5.8 6.5-5.8s6.5 2.5 6.5 5.8" />
        <path d="M18 8v5M15.5 10.5h5" />
      </svg>
    </button>

    <!-- 하단 네비게이션 -->
    <nav id="bottomNav" class="bottom-nav"></nav>
  </div>

  <script src="data.js"></script>
  <script src="common.js"></script>
  <script src="friends.js"></script>
</body>

</html>
