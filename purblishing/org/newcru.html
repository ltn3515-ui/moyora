<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>모여라 - 신규 생성</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="newcru.css">
</head>

<body>
  <div class="app">

    <main class="screen active" id="screen-newcru">

      <!-- 헤더 -->
      <header class="header">
        <button class="header__back" id="btnBack" aria-label="뒤로가기">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="#7A5C29" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="header__center">
          <span class="header__title">신규 생성</span>
        </div>
        <button class="header__bell" aria-label="알림">
          🔔<span class="header__bell-badge"></span>
        </button>
      </header>

      <!-- 진행 상태 -->
      <div class="wizard-progress">
        <div class="wizard-progress__row">
          <span class="wizard-progress__step" id="wizardStepLabel">Step 01</span>
          <span class="wizard-progress__count" id="wizardStepCount">6단계 중 1단계</span>
        </div>
        <div class="wizard-progress__track">
          <div class="wizard-progress__fill" id="wizardProgressFill"></div>
        </div>
      </div>

      <!-- 대표 사진 -->
      <div class="photo-upload" id="btnAddPhoto" role="button" aria-label="사진 추가">
        <img class="photo-upload__img" src="img_newcru_hero.png" alt="모임 대표 사진">
        <span class="photo-upload__btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          사진 추가
        </span>
      </div>

      <!-- 타이틀 -->
      <h2 class="wizard-title" id="wizardTitle">모임의 목적을<br>알려주세요!</h2>

      <!-- 목적 카테고리 -->
      <div class="purpose-grid" id="purposeGrid"></div>

      <!-- 직접입력 -->
      <button type="button" class="purpose-custom" id="customOption">
        <span id="customLabel" class="purpose-custom__label">
          ✏️&nbsp; 직접입력
        </span>
        <input type="text" id="customInput" placeholder="모임 목적을 입력해주세요" maxlength="16" />
      </button>

      <!-- 다음 단계 -->
      <div class="wizard-footer">
        <button type="button" class="btn btn-primary wizard-next-btn" id="btnNextStep">
          다음 단계로 →
        </button>
      </div>

      <!-- 하단 네비게이션 -->
      <nav class="bottom-nav" id="bottomNav"></nav>

    </main>

  </div>

  <script src="data.js"></script>
  <script src="common.js"></script>
  <script src="newcru.js"></script>
</body>

</html>
